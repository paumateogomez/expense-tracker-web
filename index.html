<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <h1>Expense Tracker</h1>
    
    <h2>Dashboard</h2>

    <p id="balance">Balance: 0€</p>
    <p id="income">Income: 0€</p>
    <p id="expenses">Expenses: 0€</p>

    <p>Amount</p>
    <input id="amount-input" type="number">

    <p>Category</p>
    <input id="category-input" type="text">

    <p>Type</p>
    <input id="type-input" type="text">

    <br>
    <br>

    <button id="add-button">Add Transaction</button>

    <h2>Transactions</h2>

    <div id="transactions-container"></div>

    <script src="script.js"></script>
</body>
</html>
